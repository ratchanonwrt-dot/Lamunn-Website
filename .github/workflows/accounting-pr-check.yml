# ด่านตรวจ PR ของทีมพัฒนา: (1) แตะเฉพาะไฟล์ที่ทีมของผู้เปิด PR มีสิทธิ์ (2) tsc ผ่าน
#
# ตั้งใจให้เป็น required status check ของ branch master — PR ที่ไม่ผ่านจะ merge ไม่ได้
# ชื่อ job ต้องเป็น accounting-scope ต่อไป เพราะ ruleset protect-master ผูกกับชื่อนี้ (ถึงจะตรวจหลายทีมแล้วก็ตาม)
#
# ใครอยู่ทีมไหน และแต่ละทีมแก้อะไรได้ อยู่ใน .github/scripts/check_scope.py (ตรงกับตารางใน AGENTS.md)
#   - ทีมบัญชี: แก้ได้ทั้งแอป Lamunn-Finance ยกเว้นหน้าการเงินที่เจ้าของสงวนไว้ (deny list)
#   - ทีม Catering: แก้ได้เฉพาะระบบ catering (allow list)
#   - เจ้าของ repo: ข้ามข้อ (1) แต่ข้อ (2) ยังต้องผ่าน
name: accounting-scope

on:
  pull_request:
    branches: [master]

jobs:
  scope:
    name: accounting-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ตรวจขอบเขตไฟล์ตามทีมของผู้เปิด PR
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 .github/scripts/check_scope.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ติดตั้ง dependencies
        run: npm ci

      - name: สร้าง Prisma client
        run: npx prisma generate --schema packages/db-finance/prisma/schema.prisma

      - name: tsc ต้องผ่าน
        working-directory: Lamunn-Finance
        run: npx tsc --noEmit
