# อัปเดตฐานข้อมูล (prisma migrate) ของ Lamunn-Finance อัตโนมัติเมื่อมี migration ใหม่เข้า master
#
# ตัว "deploy ขึ้นเว็บ" ไม่ได้อยู่ที่นี่แล้ว — Vercel ที่เชื่อมกับ GitHub ไว้ build + deploy production เองทุกครั้งที่
# master เปลี่ยน (ตั้งค่าใน Lamunn-Finance/vercel.json: branch acc/* กับ fin/* ไม่สร้าง preview)
#
# ทำไมไม่ deploy จาก Action: ขั้น `vercel deploy` ที่นี่ล้มทุกรอบตั้งแต่ run #17 ("Could not retrieve Project
# Settings") ขณะที่ production ขึ้นผ่าน Vercel Git มาตลอด ถ้าเปิดทั้งสองทางพร้อมกันจะ deploy ซ้ำ 2 รอบต่อการ merge
# จึงให้ Action ทำเฉพาะงานที่ Vercel ทำแทนไม่ได้ คือรัน migration ด้วยค่าลับของฐานข้อมูล production
#
# ลำดับเวลา: migration เสร็จในราว 35 วินาทีหลัง merge ส่วน Vercel build ราว 1 นาที ปกติฐานข้อมูลจึงพร้อมก่อน
# โค้ดใหม่ขึ้นเว็บ — แต่ไม่ได้รับประกัน ถ้า PR ไหนเพิ่มคอลัมน์ที่โค้ดใหม่ต้องใช้ทันที ให้แยก PR migration ไป merge ก่อน
#
# Secrets ที่ต้องตั้งใน GitHub → Settings → Secrets and variables → Actions:
#   DATABASE_URL   / DIRECT_URL   ค่าเดียวกับใน Lamunn-Finance/.env ของเครื่อง production
# (VERCEL_TOKEN ไม่ได้ใช้แล้ว ลบทิ้งได้)
name: deploy-finance

on:
  push:
    branches: [master]
    paths:
      - "packages/db-finance/prisma/**"
      - ".github/workflows/deploy-finance.yml"
  workflow_dispatch:

concurrency:
  group: deploy-finance
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ติดตั้ง dependencies
        run: npm ci

      # prisma migrate deploy ทำเฉพาะ migration ที่ยังไม่เคยรัน (idempotent) รันซ้ำได้ปลอดภัย
      - name: รัน database migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy --schema packages/db-finance/prisma/schema.prisma
